<!DOCTYPE html>
<!--
  Kurtside Pool Co. Billing: Tommy's iPhone app (hosted on GitHub Pages).
  Tabs:
    Log       Pick a client, tap what you did, Log it. Recent entries can be removed until billed.
    Money     What is owed, record cash/check payments, open or resend invoice PDFs.
    Settings  Prices, clients, business info, pause automation.
    Dash      Heads-up list, money, water health, work, and system status (loaded on demand).
  Water tests: on the Log tab, "Test strip" opens the camera. The photo goes to the backend,
  Claude reads the pads against the bottle chart, Tommy checks the numbers, Save stores them.
  "Type it in" does the same without a photo.
  Backend: the Apps Script web app at API_URL (Code.gs doPost). Every request is
  POST {pin, action, payload}. The PIN is asked once per device and kept in localStorage.
  Requests send no cookies, so multiple signed-in Google accounts can never interfere.
  Files in this folder: index.html, manifest.webmanifest, banner.png, apple-touch-icon.png, icon-192.png, icon-512.png
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kurtside</title>
<meta name="theme-color" content="#06111d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kurtside">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #06111d; --bg2: #0a1a2b; --card: #0e2235; --card-hi: #12304a;
    --ink: #eef3f8; --muted: #8fa4b9; --line: rgba(227,189,106,.16); --line-soft: rgba(255,255,255,.07);
    --gold: #e3bd6a; --gold-deep: #b8862f;
    --gold-grad: linear-gradient(180deg, #f8e2a2 0%, #e3bd6a 45%, #b8862f 100%);
    --aqua: #3fd0ff; --aqua-glow: rgba(63,208,255,.35);
    --c-logged: #b88a34; --c-collected: #2a9fd0;   /* chart series, validated on the card surface */
    --red: #ff6b6b; --green: #4cd69a;
    --display: 'Cinzel', Georgia, serif;
    --body: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); }
  body {
    padding-bottom: 96px;
    background:
      radial-gradient(1200px 500px at 50% -120px, rgba(63,208,255,.10), transparent 70%),
      radial-gradient(900px 400px at 100% 100%, rgba(227,189,106,.06), transparent 70%),
      var(--bg);
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  input, select, textarea { font-size: 16px; } /* 16px stops iOS from zooming on focus */

  /* ---------- Hero banner ---------- */
  /* Banner: the full image is always visible (contain), centered and capped at 960px.
     On wide screens the sides are filled with a blurred, darkened copy of the same image. */
  .hero-banner { position: relative; width: 100%; aspect-ratio: 1842 / 854; max-height: 420px; padding: 6px 0 0; overflow: hidden; background: linear-gradient(160deg, #0b1f33, #15324f); }
  .hero-banner .backdrop { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: blur(28px) brightness(.45) saturate(1.2); opacity: 0; transition: opacity .6s ease; }
  .hero-banner .main-img { position: relative; display: block; height: 100%; max-width: 960px; width: 100%; margin: 0 auto; object-fit: contain; opacity: 0; transition: opacity .6s ease; }
  .hero-banner.loaded .backdrop, .hero-banner.loaded .main-img { opacity: 1; }
  .hero-banner .fade { position: absolute; inset: auto 0 0 0; height: 10%; background: linear-gradient(180deg, transparent, var(--bg)); pointer-events: none; }
  .hero-banner .fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: 2px; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero-banner.loaded .fallback { display: none; }

  main { padding: 14px 16px 0; max-width: 640px; margin: 0 auto; position: relative; }
  .tab { display: none; animation: rise .35s ease both; }
  .tab.on { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .lbl { font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: 2.4px; text-transform: uppercase; color: var(--gold); margin: 22px 2px 10px; display: flex; align-items: center; gap: 10px; }
  .lbl::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  .card { background: linear-gradient(180deg, var(--card-hi), var(--card)); border-radius: 18px; padding: 16px; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .warn { background: rgba(255,107,107,.1); border: 1px solid rgba(255,107,107,.3); color: #ffb1b1; border-radius: 14px; padding: 11px 13px; font-size: 14px; margin-top: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }

  /* ---------- Stat strip ---------- */
  .stat { display: flex; justify-content: space-between; align-items: flex-end; }
  .stat .k { font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .money-big { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.1; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat .when { font-weight: 800; font-size: 17px; color: var(--ink); }

  /* ---------- Client picker ---------- */
  .picker { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 15px 16px; border-radius: 16px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--card-hi), var(--card)); cursor: pointer; transition: border-color .2s, box-shadow .2s; }
  .picker.sel { border-color: var(--aqua); box-shadow: 0 0 0 1px var(--aqua) inset, 0 0 24px var(--aqua-glow); }
  .picker .avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; color: #07121f; background: var(--gold-grad); flex: none; }
  .picker .avatar.empty { background: rgba(255,255,255,.06); color: var(--muted); border: 1px dashed rgba(255,255,255,.18); }
  .picker .name { font-weight: 800; font-size: 17px; }
  .picker .chev { color: var(--gold); font-size: 22px; }

  .client-list .opt { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 6px; border: 0; background: transparent; text-align: left; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .client-list .opt:last-child { border-bottom: 0; }
  .client-list .opt .nm { font-weight: 700; font-size: 16px; }
  .client-list .opt.on .nm { color: var(--aqua); }
  .client-list .tag { font-size: 11px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
  .client-list .divider { height: 1px; margin: 8px 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .7; }

  /* ---------- Chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 9px; }
  .chip { background: rgba(255,255,255,.035); border: 1px solid var(--line-soft); border-radius: 999px; padding: 11px 15px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: all .15s; }
  .chip .p { color: var(--muted); font-weight: 600; }
  .chip.sel { border-color: var(--gold); background: rgba(227,189,106,.12); box-shadow: 0 0 18px rgba(227,189,106,.18); }
  .chip.sel .p { color: var(--gold); }
  .chip.dim { opacity: .4; }
  .qty { display: inline-flex; align-items: center; gap: 7px; margin-left: 2px; font-weight: 800; }
  .qty button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--gold-grad); color: #07121f; font-weight: 800; font-size: 17px; line-height: 30px; padding: 0; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(227,189,106,.3); cursor: pointer; }
  .qty .n { min-width: 14px; text-align: center; color: var(--gold); }

  /* ---------- Forms ---------- */
  .field { display: block; margin-bottom: 13px; }
  .field span { display: block; font-size: 12px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
  .input { width: 100%; border: 1px solid var(--line-soft); border-radius: 12px; padding: 13px 14px; background: rgba(0,0,0,.25); color: var(--ink); }
  .input:focus { outline: none; border-color: var(--aqua); box-shadow: 0 0 0 3px rgba(63,208,255,.15); }
  textarea.input { min-height: 70px; resize: vertical; }
  select.input { appearance: none; }

  /* ---------- Buttons ---------- */
  .btn { border: 0; border-radius: 13px; padding: 12px 16px; font-weight: 800; font-size: 15px; background: rgba(255,255,255,.07); cursor: pointer; }
  .btn.gold { background: var(--gold-grad); color: #07121f; box-shadow: 0 6px 20px rgba(227,189,106,.25), inset 0 1px 0 rgba(255,255,255,.5); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: transparent; color: var(--red); border: 1px solid rgba(255,107,107,.35); }
  .btn.sm { padding: 8px 13px; font-size: 13px; border-radius: 10px; }
  .btn.big { width: 100%; padding: 18px; font-size: 18px; margin-top: 20px; border-radius: 16px; letter-spacing: .3px; }
  .btn:disabled { opacity: .35; box-shadow: none; filter: grayscale(.6); }
  a.btn { text-decoration: none; display: inline-block; }

  /* ---------- Money ---------- */
  .vault { text-align: center; padding: 22px 16px; background: radial-gradient(400px 160px at 50% 0%, rgba(63,208,255,.14), transparent 70%), linear-gradient(180deg, var(--card-hi), var(--card)); }
  .vault .money-big { font-size: 46px; }
  .list .item { padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
  .list .item:last-child { border-bottom: 0; }
  .amt { font-weight: 800; white-space: nowrap; }
  .badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--muted); margin-top: 4px; }
  .badge.late { background: rgba(255,107,107,.14); color: #ffa3a3; }
  .badge.ok { background: rgba(76,214,154,.14); color: var(--green); }
  .badge.hand { background: rgba(227,189,106,.14); color: var(--gold); }
  .actions { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }

  .seg { display: flex; background: rgba(0,0,0,.3); border-radius: 13px; padding: 4px; border: 1px solid var(--line-soft); }
  .seg button { flex: 1; border: 0; background: transparent; padding: 11px; border-radius: 10px; font-weight: 800; color: var(--muted); }
  .seg button.on { background: var(--gold-grad); color: #07121f; }

  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 12px; }
  .switch input { width: 22px; height: 22px; accent-color: var(--gold); }
  .item.tap { cursor: pointer; }

  /* ---------- Bottom nav ---------- */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: rgba(6,17,29,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
  nav.tabs button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 14px; font-weight: 800; font-size: 12px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  nav.tabs button .ic { font-size: 20px; line-height: 1; }
  nav.tabs button.on { color: var(--gold); background: rgba(227,189,106,.09); }

  /* ---------- Bottom sheet ---------- */
  .sheet-bg { position: fixed; inset: 0; background: rgba(2,8,14,.65); backdrop-filter: blur(3px); z-index: 20; display: none; align-items: flex-end; justify-content: center; }
  .sheet-bg.on { display: flex; }
  .sheet { background: linear-gradient(180deg, #102840, var(--bg2)); border: 1px solid var(--line); border-bottom: 0; width: 100%; max-width: 640px; max-height: 86vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom)); animation: up .25s ease both; }
  .sheet::before { content: ''; display: block; width: 44px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); margin: 0 auto 14px; }
  .sheet h3 { margin: 0 0 14px; font-family: var(--display); font-size: 20px; color: var(--gold); letter-spacing: 1px; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

  #toast { position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%) translateY(20px); background: var(--gold-grad); color: #07121f; padding: 12px 18px; border-radius: 14px; font-weight: 800; font-size: 14px; opacity: 0; transition: all .25s; z-index: 40; max-width: 90vw; text-align: center; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: var(--red); color: #fff; }
  #busy { position: fixed; inset: 0; background: rgba(6,17,29,.45); z-index: 30; display: none; align-items: center; justify-content: center; }
  #busy.on { display: flex; }
  #busy .ring { width: 46px; height: 46px; border-radius: 50%; border: 3px solid rgba(227,189,106,.2); border-top-color: var(--gold); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Service notes ---------- */
  textarea.note-box { min-height: 160px; line-height: 1.5; }
  .note-box::placeholder { color: rgba(143,164,185,.55); }
  .last-note { margin: 0 0 10px; padding: 11px 13px; border-radius: 12px; background: rgba(63,208,255,.07); border: 1px solid rgba(63,208,255,.22); font-size: 14px; line-height: 1.45; }
  .last-note .t { white-space: pre-wrap; }
  .last-note .k { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--aqua); margin-bottom: 3px; }

  /* ---------- PIN gate ---------- */
  #pinGate { position: fixed; inset: 0; z-index: 25; display: none; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(600px 300px at 50% 20%, rgba(63,208,255,.12), transparent 70%), rgba(6,17,29,.94); }
  #pinGate.on { display: flex; }
  .pin-card { width: 100%; max-width: 360px; text-align: center; }
  .pin-title { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: 1.5px; margin-bottom: 6px; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pin-input { text-align: center; font-size: 28px !important; letter-spacing: 10px; padding: 16px; }
  .pin-msg { color: #ffa3a3; font-weight: 700; margin-top: 12px; min-height: 20px; }

  /* ---------- Water tests ---------- */
  .water .k { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--aqua); }
  .levels { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .lv { font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--muted); }
  .lv b { color: var(--ink); margin-right: 4px; font-weight: 800; }
  .lv.good { background: rgba(76,214,154,.14); color: var(--green); }
  .lv.watch { background: rgba(227,189,106,.16); color: var(--gold); }
  .lv.fix { background: rgba(255,107,107,.15); color: #ffa3a3; }
  .strip-photo { display: block; width: 100%; max-height: 260px; object-fit: contain; border-radius: 14px; border: 1px solid var(--line); background: #000; margin-bottom: 10px; }
  .rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; margin-top: 12px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 6px; vertical-align: middle; }
  .dot.good { background: var(--green); } .dot.watch { background: var(--gold); } .dot.fix { background: var(--red); }
  .hist { width: 100%; border-collapse: collapse; font-size: 13px; }
  .hist th { color: var(--muted); font-weight: 800; font-size: 11px; letter-spacing: .6px; text-align: center; padding: 6px 2px; }
  .hist td { text-align: center; padding: 10px 2px; border-top: 1px solid var(--line-soft); font-weight: 700; color: var(--muted); }
  .hist td.d { text-align: left; color: var(--ink); white-space: nowrap; }
  .hist td.good { color: var(--green); } .hist td.watch { color: var(--gold); } .hist td.fix { color: #ffa3a3; }
  #busy { flex-direction: column; gap: 14px; }
  #busyMsg { font-weight: 800; color: var(--gold); letter-spacing: .4px; }

  /* ---------- Dashboard ---------- */
  .dash-head { display: flex; align-items: flex-end; justify-content: space-between; margin: 6px 2px 4px; }
  .dash-hi { font-family: var(--display); font-size: 22px; font-weight: 800; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stale { opacity: .45; transition: opacity .2s; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: linear-gradient(180deg, var(--card-hi), var(--card)); border: 1px solid var(--line); border-radius: 16px; padding: 13px 14px; }
  .tile .k { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .tile .v { font-size: 24px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tile.wide { grid-column: 1 / -1; }
  .heads { list-style: none; margin: 0; padding: 0; }
  .heads li { display: flex; gap: 10px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
  .heads li:last-child { border-bottom: 0; }
  .heads .ic { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 900; }
  .ic.fix { background: rgba(255,107,107,.18); color: #ffa3a3; } .ic.watch { background: rgba(227,189,106,.18); color: var(--gold); } .ic.good { background: rgba(76,214,154,.16); color: var(--green); }
  .chart-wrap { position: relative; margin-top: 6px; }
  .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-wrap .hit { fill: transparent; cursor: pointer; outline: none; }
  .chart-wrap .hit:hover, .chart-wrap .hit.on { fill: rgba(255,255,255,.05); }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .tip { position: absolute; top: -6px; transform: translate(-50%, -100%); background: #0a1a2b; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; pointer-events: none; white-space: nowrap; box-shadow: 0 8px 20px rgba(0,0,0,.4); display: none; }
  .tip b { display: block; color: var(--ink); font-size: 13px; }
  .tip .ln { display: inline-block; width: 12px; height: 2px; margin-right: 6px; vertical-align: middle; }
  details.nums summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 10px; }
  table.nums { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  table.nums td, table.nums th { padding: 6px 4px; text-align: right; border-top: 1px solid var(--line-soft); }
  table.nums th { color: var(--muted); font-size: 11px; font-weight: 800; }
  table.nums td:first-child, table.nums th:first-child { text-align: left; }
  .hbar { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; }
  .hbar .n { width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .track { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.05); }
  .hbar .fill { height: 8px; border-radius: 4px; background: var(--c-logged); }
  .hbar .a { width: 64px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pool { padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
  .pool:last-child { border-bottom: 0; }
  .stlabel { font-size: 11px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
  .stlabel.fix { background: rgba(255,107,107,.15); color: #ffa3a3; } .stlabel.watch { background: rgba(227,189,106,.16); color: var(--gold); } .stlabel.good { background: rgba(76,214,154,.14); color: var(--green); } .stlabel.none { background: rgba(255,255,255,.06); color: var(--muted); }
  .ring { display: flex; align-items: center; gap: 14px; }
  .ring svg { flex: none; }
  .sysgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .sysgrid div { padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
  .sysgrid div span { display: block; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 2px; }

  .acct { cursor: pointer; }
  .acct:active { background: rgba(255,255,255,.03); }
  .acct .chev { color: var(--gold); font-size: 20px; margin-left: 4px; }
  details.season { margin-top: 10px; }
  details.season > summary { list-style: none; cursor: pointer; }
  details.season > summary::-webkit-details-marker { display: none; }
  details.season > summary .chev { transition: transform .2s; display: inline-block; color: var(--gold); font-size: 20px; }
  details.season[open] > summary .chev { transform: rotate(90deg); }
  .oc { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--muted); margin-left: 4px; white-space: nowrap; }
  .oc.yes { background: rgba(76,214,154,.14); color: var(--green); }
  .sec { font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin: 18px 2px 8px; }
  .pick { display: flex; align-items: flex-start; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .pick:last-child { border-bottom: 0; }
  .pick input { width: 22px; height: 22px; accent-color: var(--gold); flex: none; margin-top: 1px; }
  .pick.off { opacity: .45; cursor: default; }

  .tagline { text-align: center; margin: 28px 0 8px; font-family: var(--display); font-size: 11px; letter-spacing: 3px; color: rgba(227,189,106,.55); }
</style>
</head>
<body>

<div class="hero-banner" id="hero">
  <img class="backdrop" src="banner.png" alt="" onload="document.getElementById('hero').classList.add('loaded')">
  <img class="main-img" src="banner.png" alt="Kurtside Pool Co.">
  <div class="fallback">KURTSIDE POOL CO.</div>
  <div class="fade"></div>
</div>

<main>
  <section id="tab-log" class="tab on"><div class="empty">Loading...</div></section>
  <section id="tab-money" class="tab"></section>
  <section id="tab-settings" class="tab"></section>
  <section id="tab-dash" class="tab"></section>
  <div class="tagline">MAINTENANCE &bull; OPENINGS &bull; CLOSINGS</div>
</main>

<nav class="tabs">
  <button data-tab="log" class="on" onclick="showTab('log')"><span class="ic">&#9998;</span>Log</button>
  <button data-tab="money" onclick="showTab('money')"><span class="ic">$</span>Money</button>
  <button data-tab="dash" onclick="showTab('dash')"><span class="ic">&#9672;</span>Dash</button>
  <button data-tab="settings" onclick="showTab('settings')"><span class="ic">&#9881;</span>Settings</button>
</nav>

<div class="sheet-bg" id="sheetBg" onclick="if (event.target === this) closeSheet()"><div class="sheet" id="sheet"></div></div>
<div id="pinGate">
  <div class="pin-card">
    <div class="pin-title">Kurtside Pool Co.</div>
    <div class="muted" style="margin-bottom:18px">Enter your PIN to open billing</div>
    <input id="pinInput" class="input pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;" onkeydown="if (event.key === 'Enter') unlock()">
    <button class="btn gold big" style="margin-top:14px" onclick="unlock()">Unlock</button>
    <div id="pinMsg" class="pin-msg"></div>
  </div>
</div>
<div id="busy"><div class="ring"></div><div id="busyMsg"></div></div>
<input type="file" id="stripInput" accept="image/*" capture="environment" style="display:none" onchange="onStripPhoto(this)">
<div id="toast"></div>

<script>
  // ---------------- State ----------------
  const S = {
    data: null,
    tab: 'log',
    date: '',
    clientId: '',
    items: {},      // itemId -> qty
    custom: null,   // { description, price } when "Other" is open
    credit: null,   // { description, price } when "Credit" is open (saved as a negative amount)
    note: '',
    payMethod: 'Cash',
    busy: false,
    pin: '',
  };

  // ---------------- Helpers ----------------
  const $ = id => document.getElementById(id);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => { const v = Number(n) || 0; return (v < 0 ? '-$' : '$') + Math.abs(v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
  const initials = name => String(name || '').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  function niceDate(ymd) {
    if (!ymd) return '';
    const [y, m, d] = ymd.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  const priceById = id => S.data.prices.find(p => p.id === id);
  const clientById = id => S.data.clients.find(c => c.id === id);
  const byName = (a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' });

  /** Active clients split for the picker: Weekly first, then Open/Close, each alphabetical. */
  function clientGroups() {
    const active = S.data.clients.filter(c => c.active);
    return {
      weekly: active.filter(c => c.type === 'Weekly').sort(byName),
      openClose: active.filter(c => c.type !== 'Weekly').sort(byName),
    };
  }

  // ---------------- PIN ----------------
  const PIN_KEY = 'kurtsidePin';
  function loadPin() { try { return localStorage.getItem(PIN_KEY) || ''; } catch (e) { return ''; } }
  function savePin(pin) { try { localStorage.setItem(PIN_KEY, pin); } catch (e) {} }
  function forgetPin() { try { localStorage.removeItem(PIN_KEY); } catch (e) {} }

  // ---------------- Backend ----------------
  // The Apps Script web app URL (Deploy > Manage deployments, ends in /exec).
  const API_URL = 'https://script.google.com/macros/s/AKfycbykZYkYEANosVuqJPJNjaRNGsRJGXS1tzow9BGWxh3tkOuiIlG8w2x4ir34C7Pj4J8LNQ/exec';

  /**
   * Every server call: POST {pin, action, payload} to API_URL, get back {ok, data | error}.
   * text/plain avoids a CORS preflight; credentials 'omit' keeps Google sign-ins out of it.
   */
  async function call(action, payload) {
    let res;
    try {
      res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ pin: S.pin, action, payload }),
        credentials: 'omit',
        redirect: 'follow',
      });
    } catch (e) {
      throw new Error('No connection. Check your signal and try again.');
    }
    let body;
    try { body = await res.json(); } catch (e) { throw new Error('Server hiccup. Try again in a moment.'); }
    if (!body.ok) {
      if (body.error === 'WRONG_PIN') { S.pin = ''; forgetPin(); showPinScreen('That PIN did not work.'); }
      throw new Error(body.error || 'Something went wrong.');
    }
    return body.data;
  }

  function showPinScreen(msg) {
    $('pinGate').classList.add('on');
    $('pinMsg').textContent = msg || '';
    $('pinInput').value = '';
    setTimeout(() => $('pinInput').focus(), 50);
  }

  async function unlock() {
    const pin = $('pinInput').value.trim();
    if (!pin) return;
    S.pin = pin;
    $('pinMsg').textContent = '';
    if (await run('bootstrap')) {
      savePin(pin);
      $('pinGate').classList.remove('on');
    }
  }

  /** Runs a server call, redraws on success, toasts on error. Returns true on success. */
  async function run(action, payload, okMsg) {
    if (S.busy) return false;
    setBusy(true);
    try {
      const data = await call(action, payload);
      if (data && data.clients) { S.data = data; render(); }
      if (okMsg) toast(okMsg);
      return true;
    } catch (e) {
      if (!(e && e.message === 'WRONG_PIN')) toast((e && e.message) || String(e), true);
      return false;
    } finally {
      setBusy(false);
    }
  }

  function setBusy(on, msg) { S.busy = on; $('busy').classList.toggle('on', on); $('busyMsg').textContent = on ? (msg || '') : ''; }
  let toastTimer;
  function toast(msg, isErr) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.toggle('err', !!isErr);
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), isErr ? 4200 : 2400);
  }
  function openSheet(html) { $('sheet').innerHTML = html; $('sheetBg').classList.add('on'); }
  function closeSheet() { $('sheetBg').classList.remove('on'); }

  function showTab(tab) {
    S.tab = tab;
    document.querySelectorAll('.tab').forEach(el => el.classList.toggle('on', el.id === 'tab-' + tab));
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    window.scrollTo(0, 0);
    if (tab === 'dash') loadDash();
  }

  // ---------------- Render ----------------
  function render() {
    if (!S.date) S.date = S.data.today;
    renderLog();
    renderMoney();
    renderSettings();
  }

  // ----- Log tab -----
  function logTotal() {
    let t = 0;
    Object.keys(S.items).forEach(id => { const p = priceById(id); if (p) t += p.price * S.items[id]; });
    if (S.custom) t += Number(S.custom.price) || 0;
    if (S.credit) t -= Math.abs(Number(S.credit.price) || 0);
    return t;
  }

  function renderLog() {
    const d = S.data;
    const canLog = S.clientId && (Object.keys(S.items).length || S.custom || S.credit);
    const picked = S.clientId ? clientById(S.clientId) : null;
    const choices = orderedChoices(d.prices, picked);
    const anyClients = d.clients.some(c => c.active);
    const lastNote = S.clientId && d.lastNotes ? d.lastNotes[S.clientId] : null;

    const chip = p => {
      const sel = S.items[p.id];
      const noPrice = !(p.price > 0);
      const qty = sel && p.kind === 'Extra'
        ? `<span class="qty"><button onclick="event.stopPropagation(); bump('${p.id}', -1)">&minus;</button><span class="n">${sel}</span><button onclick="event.stopPropagation(); bump('${p.id}', 1)">+</button></span>`
        : '';
      // A div, not a button: the +/- stepper buttons live inside it, and buttons cannot nest.
      return `<div class="chip ${sel ? 'sel' : ''} ${noPrice ? 'dim' : ''}" role="button" tabindex="0" onclick="toggleItem('${p.id}')">
        ${esc(p.name)} <span class="p">${noPrice ? 'no price' : money(p.price)}</span>${qty}</div>`;
    };

    $('tab-log').innerHTML = `
      <div class="card stat">
        <div>
          <div class="k">Logged, not billed</div>
          <div class="money-big">${money(d.unbilledTotal)}</div>
        </div>
        <div style="text-align:right">
          <div class="k">Bills go out</div>
          <div class="when">${niceDate(d.nextBilling)}</div>
        </div>
      </div>

      <div class="lbl">Who</div>
      ${anyClients ? `
        <button class="picker ${picked ? 'sel' : ''}" onclick="openClientPicker()">
          <div class="avatar ${picked ? '' : 'empty'}">${picked ? esc(initials(picked.name)) : '?'}</div>
          <div class="grow">
            <div class="name">${picked ? esc(picked.name) : 'Choose a client'}</div>
            <div class="muted">${picked ? esc(picked.type === 'Weekly' ? 'Weekly service' : 'Openings & closings') : 'Tap to pick from your list'}</div>
          </div>
          <div class="chev">&#9662;</div>
        </button>`
        : `<div class="card empty">No clients yet. Add them in Settings.</div>`}

      ${anyClients && Array.isArray(d.targets) && (!picked || picked.type === 'Weekly') ? `<div class="lbl">Water</div>${waterCard(picked)}` : ''}

      <div class="lbl">When</div>
      <input type="date" class="input" value="${S.date}" max="${d.today}" onchange="S.date = this.value">

      <div class="lbl">What</div>
      <div class="chips">
        ${choices.map(chip).join('')}
        <button class="chip ${S.custom ? 'sel' : ''}" onclick="toggleCustom()">+ Other</button>
        <button class="chip ${S.credit ? 'sel' : ''}" onclick="toggleCredit()">&minus; Credit</button>
      </div>
      ${S.custom ? `
        <div class="card" style="margin-top:12px">
          ${(d.otherSuggestions || []).length ? `
            <div class="muted" style="margin-bottom:8px">Tap one you've done before:</div>
            <div class="chips" style="margin-bottom:14px">
              ${d.otherSuggestions.map((o, i) => `<div class="chip ${S.custom.description === o.description && Number(S.custom.price) === o.price ? 'sel' : ''}" role="button" tabindex="0" onclick="pickOther(${i})">${esc(o.description)} <span class="p">${money(o.price)}</span></div>`).join('')}
            </div>
            <div class="muted" style="margin-bottom:8px">Or something new:</div>` : ''}
          <label class="field"><span>What was it?</span>
            <input class="input" id="customDesc" value="${esc(S.custom.description)}" placeholder="Leaf cleanup, repair, part..." oninput="S.custom.description = this.value"></label>
          <label class="field" style="margin:0"><span>Charge</span>
            <input class="input" id="customPrice" type="number" inputmode="decimal" step="0.01" value="${esc(S.custom.price)}" placeholder="0.00" oninput="S.custom.price = this.value; updateLogButton()"></label>
        </div>` : ''}
      ${S.credit ? `
        <div class="card" style="margin-top:12px">
          <label class="field"><span>Credit for</span>
            <input class="input" id="creditDesc" value="${esc(S.credit.description)}" placeholder="Discount, trade, overpayment..." oninput="S.credit.description = this.value"></label>
          <label class="field" style="margin:0"><span>Amount off</span>
            <input class="input" id="creditPrice" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(S.credit.price)}" placeholder="0.00" oninput="S.credit.price = this.value; updateLogButton()"></label>
          <div class="muted" style="margin-top:8px">Comes off this client's next bill.</div>
        </div>` : ''}

      <div class="lbl">Service notes</div>
      ${lastNote ? `
        <div class="last-note">
          <div class="k">Last note &middot; ${niceDate(lastNote.date)}</div>
          <div class="t">${esc(lastNote.note)}</div>
        </div>` : ''}
      <textarea class="input note-box" placeholder="${NOTE_HINT}" oninput="S.note = this.value">${esc(S.note)}</textarea>
      <div class="muted" style="margin:6px 2px 0">Private. Notes stay in your log and never print on invoices. Tap the mic on the keyboard to talk.</div>

      <button class="btn gold big" id="logBtn" ${canLog ? '' : 'disabled'} onclick="logWork()">${logButtonText(canLog)}</button>

      <div class="lbl">Recent</div>
      <div class="card list">${d.recent.length ? d.recent.map((j, i) => `
        <div class="item row">
          <div class="grow">
            <div style="font-weight:800">${esc(j.clientName)}</div>
            <div class="muted">${niceDate(j.date)} &middot; ${esc(j.items)}</div>
          </div>
          <div style="text-align:right">
            <div class="amt">${money(j.amount)}</div>
            ${j.billed === 'all'
              ? `<span class="badge">Billed #${esc(j.invoiceIds.join(', #'))}</span>`
              : `<button class="btn danger sm" style="margin-top:6px" onclick="voidJob(${i})">Remove</button>`}
          </div>
        </div>`).join('') : '<div class="empty">Nothing logged yet.</div>'}
      </div>`;
  }

  /** Placeholder for the service notes box: what is worth tracking week to week. */
  const NOTE_HINT = [
    'Cl 3 \u00b7 pH 7.4 \u00b7 filter 18 psi',
    'Added 2 gal chlorine, 1 lb acid',
    'Watch: pump noise, leak at return',
    'Next week: bring filter cartridge',
  ].join('&#10;');

  /**
   * One list of choices, most used first, shaped by the client:
   *   Weekly client:      Weekly Visit, then extras, then Opening / Closing (twice a year) near the end.
   *   Open/Close client:  Opening / Closing first (that is the whole job), then extras. No Weekly Visit.
   *   No client yet:      same order as a weekly client.
   * Within each group the Price List "sort" column decides (lower = earlier).
   */
  function orderedChoices(prices, client) {
    const active = prices.filter(p => p.active).sort((a, b) => a.sort - b.sort);
    const visit = active.filter(p => p.id === 'VISIT');
    const seasonal = active.filter(p => p.kind === 'Service' && p.id !== 'VISIT');
    const extras = active.filter(p => p.kind === 'Extra');
    if (client && client.type !== 'Weekly') return seasonal.concat(extras);
    // Extras that are used less than openings/closings (sort 20+) go after them.
    const common = extras.filter(p => p.sort < 20), rare = extras.filter(p => p.sort >= 20);
    return visit.concat(common, seasonal, rare);
  }

  const logButtonText = ok => ok ? 'Log it  ' + money(logTotal()) : 'Log it';

  function updateLogButton() {
    const ok = S.clientId && (Object.keys(S.items).length || S.custom || S.credit);
    $('logBtn').disabled = !ok;
    $('logBtn').textContent = logButtonText(ok);
  }

  function openClientPicker() {
    const g = clientGroups();
    const opt = c => `
      <button class="opt ${S.clientId === c.id ? 'on' : ''}" onclick="pickClient('${c.id}')">
        <span class="nm">${esc(c.name)}</span>
        <span class="tag">${c.type === 'Weekly' ? 'Weekly' : 'Open/Close'}</span>
      </button>`;
    openSheet(`
      <h3>Choose a client</h3>
      <div class="client-list">
        ${g.weekly.map(opt).join('')}
        ${g.weekly.length && g.openClose.length ? '<div class="divider"></div>' : ''}
        ${g.openClose.map(opt).join('')}
      </div>`);
  }

  function pickClient(id) {
    S.clientId = id;
    const c = clientById(id);
    const visit = priceById('VISIT');
    // Drop anything this client can't get (e.g. a Weekly Visit carried over to an open/close client).
    const allowed = new Set(orderedChoices(S.data.prices, c).map(p => p.id));
    Object.keys(S.items).forEach(k => { if (!allowed.has(k)) delete S.items[k]; });
    // Weekly clients default to a visit so the common case is: pick client, Log it.
    if (c && c.type === 'Weekly' && !Object.keys(S.items).length && !S.custom && visit && visit.active && visit.price > 0) {
      S.items = { VISIT: 1 };
    }
    closeSheet();
    renderLog();
  }

  function toggleItem(id) {
    const p = priceById(id);
    if (!p) return;
    if (!(p.price > 0)) { toast('Set a price for ' + p.name + ' in Settings first.', true); return; }
    if (S.items[id]) delete S.items[id]; else S.items[id] = 1;
    renderLog();
  }

  function bump(id, delta) {
    const next = (S.items[id] || 0) + delta;
    if (next <= 0) delete S.items[id]; else S.items[id] = Math.min(next, 99);
    renderLog();
  }

  /** One tap on a past "Other" job fills in its name and last price. */
  function pickOther(i) {
    const o = S.data.otherSuggestions[i];
    S.custom = { description: o.description, price: o.price };
    renderLog();
  }

  function toggleCredit() {
    S.credit = S.credit ? null : { description: '', price: '' };
    renderLog();
    if (S.credit) $('creditDesc').focus();
  }

  function toggleCustom() {
    S.custom = S.custom ? null : { description: '', price: '' };
    renderLog();
    if (S.custom && !(S.data.otherSuggestions || []).length) $('customDesc').focus();
  }

  async function logWork() {
    const client = clientById(S.clientId);
    const items = Object.keys(S.items).map(id => ({ itemId: id, qty: S.items[id] }));
    if (S.custom) items.push({ itemId: 'CUSTOM', description: S.custom.description, price: S.custom.price, qty: 1 });
    if (S.credit) items.push({ itemId: 'CREDIT', description: S.credit.description, price: Math.abs(Number(S.credit.price) || 0), qty: 1 });
    const total = logTotal();
    const ok = await run('logWork', { date: S.date, clientId: S.clientId, items, note: S.note },
      'Logged ' + (client ? client.name.split(' ')[0] : '') + ': ' + money(total));
    if (ok) {
      S.clientId = ''; S.items = {}; S.custom = null; S.credit = null; S.note = '';
      renderLog();
    }
  }

  /** Removes a whole job from Recent (only its unbilled lines; billed ones stay on their invoice). */
  function voidJob(i) {
    const j = S.data.recent[i];
    const what = j.billed === 'some' ? 'the unbilled part of this job' : 'this job';
    if (!confirm(`Remove ${what} (${j.clientName}, ${money(j.amount)})? It will not be billed.`)) return;
    run('voidWork', j.ids, 'Removed');
  }

  // ----- Water tests -----
  // Status colors mirror readingStatus_() in Code.gs, driven by the same TARGETS list from the server.
  function readingStatus(key, vals) {
    const t = S.data.targets.find(x => x.key === key);
    const v = vals[key];
    if (!t || v === '' || v == null) return '';
    if (t.combined) {
      if (vals.fc === '' || vals.fc == null) return '';
      const cc = Number(v) - Number(vals.fc);
      return cc <= 0.5 ? 'good' : cc <= 1 ? 'watch' : 'fix';
    }
    if (v >= t.ideal[0] && v <= t.ideal[1]) return 'good';
    if (v >= t.ok[0] && v <= t.ok[1]) return 'watch';
    return 'fix';
  }

  const levelChips = vals => S.data.targets
    .filter(t => vals[t.key] !== '' && vals[t.key] != null)
    .map(t => `<span class="lv ${readingStatus(t.key, vals)}"><b>${t.short}</b>${esc(vals[t.key])}</span>`).join('');

  function waterCard(client) {
    const list = client ? ((S.data.readings || {})[client.id] || []) : [];
    const last = list[0];
    const buttons = `
      <div class="actions">
        ${S.data.stripReader ? '<button class="btn gold sm" onclick="startStrip()">&#128247; Test strip</button>' : ''}
        <button class="btn ghost sm" onclick="openReading(null)">Type it in</button>
        ${list.length ? '<button class="btn ghost sm" onclick="openHistory()">History</button>' : ''}
      </div>`;
    if (!client) return `<div class="card water"><div class="muted">Pick a weekly client to test their water.</div></div>`;
    const tip = S.data.stripReader
      ? '<div class="muted" style="margin-top:10px;font-size:12px">Photo tip: lay the strip right next to the chart, whole strip and whole chart in the frame, in shade (no direct sun).</div>'
      : '';
    return `<div class="card water">
      ${last
        ? `<div class="k">Last test &middot; ${niceDate(last.date)}</div><div class="levels">${levelChips(last)}</div>`
        : `<div class="muted">No water tests yet for ${esc(client.name)}.</div>`}
      ${buttons}
      ${tip}
    </div>`;
  }

  function startStrip() {
    if (!S.clientId) { toast('Pick a client first.', true); return; }
    $('stripInput').value = '';
    $('stripInput').click();
  }

  /** Shrinks the camera photo to 1280px JPEG so uploads are fast on cell signal. */
  function shrinkPhoto(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * scale);
        c.height = Math.round(img.naturalHeight * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not open that photo.')); };
      img.src = url;
    });
  }

  async function onStripPhoto(input) {
    const file = input.files && input.files[0];
    if (!file || S.busy) return;
    let photo = '';
    setBusy(true, 'Reading the strip...');
    try {
      photo = await shrinkPhoto(file);
      const result = await call('readStrip', { clientId: S.clientId, image: photo.split(',')[1] });
      setBusy(false);
      openReading(result, photo);
    } catch (e) {
      setBusy(false);
      if (e && e.message === 'WRONG_PIN') return;
      toast((e && e.message) || String(e), true);
      if (photo) openReading({ readings: {}, notes: '', photoId: '', found: true }, photo);
    }
  }

  /** The check-and-save sheet. r = strip result from the server, or null to type readings by hand. */
  function openReading(r, photo) {
    const client = clientById(S.clientId);
    if (!client) { toast('Pick a client first.', true); return; }
    S.reading = { ai: r && r.photoId ? r.readings : null, photoId: (r && r.photoId) || '' };
    const vals = (r && r.readings) || {};
    openSheet(`
      <h3>Water test</h3>
      <div class="muted" style="margin:-6px 0 14px">${esc(client.name)}</div>
      ${photo ? `<img class="strip-photo" src="${photo}" alt="Test strip">` : ''}
      ${r && r.found === false ? '<div class="warn" style="margin:0 0 10px">Could not find a strip and its color chart in that photo. Retake it with the strip held right next to the bottle chart, or type the numbers.</div>' : ''}
      ${r && r.notes ? `<div class="muted" style="margin-bottom:6px">Reader: ${esc(r.notes)}</div>` : ''}
      ${r && r.photoId ? '<div class="muted" style="color:var(--aqua)">Check each number against the chart, fix any that look off, then Save.</div>' : ''}
      <div class="rgrid">
        ${S.data.targets.map(t => `
          <label class="field"><span>${esc(t.label)}<i class="dot" id="dot-${t.key}"></i></span>
            <input class="input" id="rv-${t.key}" type="number" inputmode="decimal" step="any" value="${vals[t.key] === '' || vals[t.key] == null ? '' : esc(vals[t.key])}" oninput="updateDots()"></label>`).join('')}
      </div>
      <label class="field"><span>Date</span><input class="input" id="rDate" type="date" value="${S.date || S.data.today}" max="${S.data.today}"></label>
      <label class="field"><span>Note (optional)</span><textarea class="input" id="rNote" placeholder="Added 1 gal chlorine, cloudy water..."></textarea></label>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost grow" onclick="closeSheet()">Cancel</button>
        ${S.data.stripReader ? '<button class="btn ghost grow" onclick="closeSheet(); startStrip()">Retake</button>' : ''}
        <button class="btn gold grow" onclick="saveReading()">Save</button>
      </div>`);
    updateDots();
  }

  function readingInputs() {
    const vals = {};
    S.data.targets.forEach(t => { const v = $('rv-' + t.key).value.trim(); vals[t.key] = v === '' ? '' : Number(v); });
    return vals;
  }

  function updateDots() {
    const vals = readingInputs();
    S.data.targets.forEach(t => { $('dot-' + t.key).className = 'dot ' + readingStatus(t.key, vals); });
  }

  async function saveReading() {
    const ok = await run('saveReading', {
      clientId: S.clientId, date: $('rDate').value, readings: readingInputs(),
      ai: S.reading.ai, photoId: S.reading.photoId, note: $('rNote').value,
    }, 'Water test saved');
    if (ok) closeSheet();
  }

  function openHistory() {
    const client = clientById(S.clientId);
    const list = (client && (S.data.readings || {})[client.id]) || [];
    const t = S.data.targets;
    openSheet(`
      <h3>Water history</h3>
      <div class="muted" style="margin:-6px 0 14px">${esc(client ? client.name : '')} &middot; last ${list.length} test${list.length === 1 ? '' : 's'}</div>
      <table class="hist">
        <tr><th style="text-align:left">Date</th>${t.map(x => `<th>${x.short}</th>`).join('')}</tr>
        ${list.map(r => `<tr><td class="d">${niceDate(r.date)}</td>${t.map(x => `<td class="${readingStatus(x.key, r)}">${r[x.key] === '' ? '&ndash;' : esc(r[x.key])}</td>`).join('')}</tr>`).join('')}
      </table>
      <div class="muted" style="margin-top:12px"><span style="color:var(--green)">Green</span> on target &middot; <span style="color:var(--gold)">Gold</span> watch &middot; <span style="color:#ffa3a3">Red</span> adjust. TC is judged by TC minus FC.</div>
      <button class="btn ghost big" onclick="closeSheet()">Close</button>`);
  }

  // ----- Dash tab -----
  // Fetched on demand (action "dashboard"). While it refreshes, the last render stays up, dimmed.
  async function loadDash() {
    const el = $('tab-dash');
    if (!S.dash) el.innerHTML = '<div class="empty">Crunching the numbers...</div>';
    else el.classList.add('stale');
    try {
      S.dash = await call('dashboard');
      renderDash();
    } catch (e) {
      if (!(e && e.message === 'WRONG_PIN')) toast((e && e.message) || String(e), true);
      if (!S.dash) el.innerHTML = '<div class="empty">Could not load the dashboard. Pull down or tap Dash to retry.</div>';
    } finally {
      el.classList.remove('stale');
    }
  }

  const ICON = { fix: '&#10005;', watch: '!', good: '&#10003;' };
  const WORD = { fix: 'Adjust', watch: 'Watch', good: 'Good', none: 'Not tested' };
  const ago = n => n === 0 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago';
  const whole = n => '$' + Math.round(Number(n) || 0).toLocaleString('en-US');
  const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');

  /** The auto to-do list: everything on the dashboard that wants a decision, worst first. */
  function headsUp(D) {
    const out = [];
    const m = D.money, w = D.work, wa = D.water, sy = D.system;
    if (m.lateCount) out.push(['fix', `${m.lateCount} late invoice${m.lateCount === 1 ? '' : 's'}: ${money(m.lateTotal)} past due`]);
    wa.pools.filter(p => p.worst === 'fix').forEach(p => out.push(['fix', `${esc(p.name)}'s water needs adjusting (${p.flags.filter(f => f.status === 'fix').map(f => esc(f.label)).join(', ')})`]));
    w.accounts.filter(x => x.overdue).forEach(x => out.push(['watch', x.daysSince === null
      ? `${esc(x.name)}: no ${x.biweekly ? 'biweekly' : 'weekly'} visit logged yet`
      : `${esc(x.name)}: last visit ${ago(x.daysSince)}${x.biweekly ? ' (biweekly)' : ''}`]));
    if (m.truck.cash + m.truck.checks > 0) out.push(['watch', `Deposit: ${money(m.truck.cash)} cash and ${money(m.truck.checks)} in checks taken this week`]);
    const mo = new Date().getMonth();
    if (mo >= 8 && mo <= 10 && w.closingsLeft.length) out.push(['watch', `Closing season: ${w.closingsLeft.length} pool${w.closingsLeft.length === 1 ? '' : 's'} still to close`]);
    if (sy.unpricedItems.length) out.push(['fix', `No price set for ${sy.unpricedItems.map(esc).join(', ')}. Settings > Prices.`]);
    if (!sy.ownerEmailSet) out.push(['watch', 'Your email is blank in Settings, so previews and invoice copies are going nowhere useful']);
    if (sy.missingEmails) out.push(['watch', `${sy.missingEmails} client${sy.missingEmails === 1 ? ' has' : 's have'} no email: their bills must be handed over`]);
    if (sy.paused) out.push(['fix', 'Automation is paused: no invoices or reminders will go out']);
    if (sy.lastDailyHoursAgo !== null && sy.lastDailyHoursAgo > 30) out.push(['fix', `The 7am daily job last ran ${sy.lastDailyHoursAgo} hours ago`]);
    return out;
  }

  /** Six-month grouped bars: Logged (work) vs Collected (payments). Tap a month for its numbers. */
  function moneyChart(months) {
    const W = 320, H = 150, top = 14, bottom = 22, left = 34;
    const max = Math.max(1, ...months.map(x => Math.max(x.logged, x.collected)));
    const step = Math.pow(10, Math.floor(Math.log10(max)));
    const nice = Math.ceil(max / step) * step;
    const y = v => top + (H - top - bottom) * (1 - v / nice);
    const slot = (W - left) / months.length, bw = Math.min(14, slot / 3);
    const bar = (x, v, color) => {
      if (!(v > 0)) return '';
      const yy = y(v), h = (H - bottom) - yy, r = Math.min(4, h, bw / 2);
      return `<path fill="${color}" d="M${x},${H - bottom} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${H - bottom} Z"/>`;
    };
    let g = '';
    [0, nice / 2, nice].forEach(v => {
      g += `<line x1="${left}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,${v ? .06 : .18})"/>` +
        `<text x="${left - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#8fa4b9">${v >= 1000 ? '$' + (v / 1000) + 'k' : '$' + v}</text>`;
    });
    months.forEach((m, i) => {
      const cx = left + slot * i + slot / 2;
      g += bar(cx - bw - 1, m.logged, 'var(--c-logged)') + bar(cx + 1, m.collected, 'var(--c-collected)');
      g += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#8fa4b9">${m.label}</text>`;
      g += `<rect class="hit" x="${left + slot * i}" y="0" width="${slot}" height="${H - bottom}" rx="6" data-i="${i}" tabindex="0" onclick="chartTip(${i})" onfocus="chartTip(${i})"></rect>`;
    });
    return `<div class="chart-wrap" id="mchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Logged and collected by month">${g}</svg><div class="tip" id="mtip"></div></div>
      <div class="legend"><span><i style="background:var(--c-logged)"></i>Logged (work done)</span><span><i style="background:var(--c-collected)"></i>Collected</span></div>
      <details class="nums"><summary>Show numbers</summary><table class="nums"><tr><th>Month</th><th>Logged</th><th>Collected</th></tr>
        ${months.map(m => `<tr><td>${m.label}</td><td>${money(m.logged)}</td><td>${money(m.collected)}</td></tr>`).join('')}</table></details>`;
  }

  function chartTip(i) {
    const m = S.dash.money.months[i];
    const wrap = $('mchart'), tip = $('mtip');
    const hits = wrap.querySelectorAll('.hit');
    hits.forEach(h => h.classList.toggle('on', Number(h.dataset.i) === i));
    const r = hits[i].getBoundingClientRect(), wr = wrap.getBoundingClientRect();
    tip.innerHTML = `<div style="color:var(--muted);margin-bottom:3px">${m.label}</div>
      <b><span class="ln" style="background:var(--c-logged)"></span>${money(m.logged)} <span style="color:var(--muted);font-weight:600">logged</span></b>
      <b><span class="ln" style="background:var(--c-collected)"></span>${money(m.collected)} <span style="color:var(--muted);font-weight:600">collected</span></b>`;
    tip.style.left = Math.min(Math.max(r.left - wr.left + r.width / 2, 70), wr.width - 70) + 'px';
    tip.style.display = 'block';
    clearTimeout(chartTip.t);
    chartTip.t = setTimeout(() => { tip.style.display = 'none'; hits.forEach(h => h.classList.remove('on')); }, 3500);
  }

  function closingRing(done, total) {
    const pct = total ? done / total : 0, R = 26, C = 2 * Math.PI * R;
    return `<svg width="68" height="68" viewBox="0 0 68 68" aria-hidden="true">
      <circle cx="34" cy="34" r="${R}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="7"/>
      <circle cx="34" cy="34" r="${R}" fill="none" stroke="var(--c-collected)" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="${(C * pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 34 34)"/>
      <text x="34" y="39" text-anchor="middle" font-size="15" font-weight="800" fill="#eef3f8">${Math.round(pct * 100)}%</text></svg>`;
  }

  function renderDash() {
    const D = S.dash, m = D.money, w = D.work, wa = D.water, sy = D.system;
    const hr = new Date().getHours();
    const hi = (hr < 12 ? 'Morning' : hr < 17 ? 'Afternoon' : 'Evening') + (D.owner ? ', ' + esc(D.owner) : '');
    const heads = headsUp(D);
    const maxTop = Math.max(1, ...m.topClients.map(c => c.amount));
    // Open Balances: only clients who owe money, meaning unbilled work or an unpaid invoice.
    // Everyone else is still reachable under Openings & Closings.
    const active = w.accounts.filter(a => a.unbilledCount || a.openCount)
      .sort((a, b) => (b.late - a.late) || ((b.unbilled + b.open) - (a.unbilled + a.open)));
    const quiet = w.accounts.length - active.length;

    $('tab-dash').innerHTML = `
      <div class="dash-head"><div class="dash-hi">${hi}</div>
        <button class="btn ghost sm" onclick="loadDash()">&#8635; ${esc(D.generated)}</button></div>

      <div class="lbl">Heads up</div>
      <div class="card">${heads.length
        ? `<ul class="heads">${heads.map(([st, t]) => `<li><span class="ic ${st}">${ICON[st]}</span><span>${t}</span></li>`).join('')}</ul>`
        : `<ul class="heads"><li><span class="ic good">${ICON.good}</span><span>All clear. Nothing needs you right now.</span></li></ul>`}</div>

      <div class="lbl">Money</div>
      <div class="tiles">
        <div class="tile wide"><div class="k">Owed to you</div><div class="v money-big" style="font-size:34px">${money(m.owed)}</div>
          <div class="s">${m.openCount} open invoice${m.openCount === 1 ? '' : 's'}${m.lateCount ? ` &middot; <span style="color:#ffa3a3">${m.lateCount} late</span>` : ''}</div></div>
        <div class="tile"><div class="k">Logged this month</div><div class="v">${whole(m.loggedThisMonth)}</div><div class="s">work done</div></div>
        <div class="tile"><div class="k">Collected this month</div><div class="v">${whole(m.collectedThisMonth)}</div><div class="s">cash + checks</div></div>
        <div class="tile"><div class="k">In the truck</div><div class="v">${whole(m.truck.cash + m.truck.checks)}</div><div class="s">${money(m.truck.cash)} cash &middot; ${m.truck.checkCount} check${m.truck.checkCount === 1 ? '' : 's'}, last 7 days</div></div>
        <div class="tile"><div class="k">Avg days to pay</div><div class="v">${m.avgDaysToPay === null ? '&ndash;' : m.avgDaysToPay}</div><div class="s">invoice to paid in full</div></div>
      </div>
      <div class="card" style="margin-top:10px">
        <div class="row"><div class="grow" style="font-weight:800">Last 6 months</div><div class="muted">Season: ${whole(m.seasonLogged)}</div></div>
        ${moneyChart(m.months)}
      </div>
      ${m.late.length ? `<div class="card list" style="margin-top:10px"><div style="font-weight:800;margin-bottom:4px">Late payers</div>
        ${m.late.map(l => `<div class="item row"><div class="grow"><div style="font-weight:700">${esc(l.name)}</div><div class="muted">#${esc(l.id)} &middot; ${l.days} day${l.days === 1 ? '' : 's'} late</div></div><div class="amt">${money(l.balance)}</div></div>`).join('')}</div>` : ''}
      ${m.topClients.length ? `<div class="card" style="margin-top:10px"><div style="font-weight:800;margin-bottom:6px">Top clients this season</div>
        ${m.topClients.map(c => `<div class="hbar"><div class="n">${esc(c.name)}</div><div class="track"><div class="fill" style="width:${(c.amount / maxTop * 100).toFixed(1)}%"></div></div><div class="a">${whole(c.amount)}</div></div>`).join('')}</div>` : ''}

      <div class="lbl">Water &middot; weekly pools</div>
      <div class="tiles">
        <div class="tile"><div class="k">Need adjusting</div><div class="v" style="color:${wa.needAttention ? '#ffa3a3' : 'var(--ink)'}">${wa.needAttention}</div><div class="s">${wa.watch} to watch &middot; ${wa.good} good</div></div>
        <div class="tile"><div class="k">Tests this month</div><div class="v">${wa.testsThisMonth}</div><div class="s">${wa.untested} pool${wa.untested === 1 ? '' : 's'} never tested</div></div>
      </div>
      <div class="card list" style="margin-top:10px">
        ${wa.pools.map(p => p.tested ? `
          <div class="pool"><div class="row"><div class="grow"><div style="font-weight:800">${esc(p.name)}</div><div class="muted">Tested ${ago(p.daysSince)}</div></div>
            <span class="stlabel ${p.worst}">${ICON[p.worst]} ${WORD[p.worst]}</span></div>
            ${p.flags.length ? `<div class="levels">${p.flags.map(f => `<span class="lv ${f.status}" title="${esc(f.note || '')}"><b>${esc(f.label)}</b>${esc(f.value)}</span>`).join('')}</div>` : ''}
            ${p.flags.filter(f => f.note).map(f => `<div class="muted" style="margin-top:6px;font-size:12px">${esc(f.label)}: ${esc(f.note)}</div>`).join('')}
          </div>` : `
          <div class="pool"><div class="row"><div class="grow" style="font-weight:700">${esc(p.name)}</div><span class="stlabel none">${WORD.none}</span></div></div>`).join('')}
      </div>

      <div class="lbl">Work</div>
      <div class="tiles">
        <div class="tile"><div class="k">Visits this week</div><div class="v">${w.visitsThisWeek}</div><div class="s">last 7 days</div></div>
        <div class="tile"><div class="k">Jobs this month</div><div class="v">${w.jobsThisMonth}</div><div class="s">everything logged</div></div>
      </div>
      <div class="card list" style="margin-top:10px"><div style="font-weight:800;margin-bottom:2px">Open Balances</div>

        ${active.length ? active.map(acctRow).join('') : '<div class="empty">Nobody owes you anything. Nice.</div>'}
        ${quiet ? `<div class="muted" style="margin-top:8px;font-size:12px">${quiet} paid-up client${quiet === 1 ? ' is' : 's are'} under Openings &amp; Closings below.</div>` : ''}
