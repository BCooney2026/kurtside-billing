<!DOCTYPE html>
<!--
  Kurtside Pool Co. Billing: Tommy's iPhone app (hosted on GitHub Pages).
  Tabs:
    Log       Pick a client, tap what you did, Log it. Recent entries can be removed until billed.
    Money     What is owed, record cash/check payments, open or resend invoice PDFs.
    Settings  Prices, clients, business info, pause automation.
  Backend: the Apps Script web app at API_URL (Code.gs doPost). Every request is
  POST {pin, action, payload}. The PIN is asked once per device and kept in localStorage.
  Requests send no cookies, so multiple signed-in Google accounts can never interfere.
  Files in this folder: index.html, manifest.webmanifest, banner.png, apple-touch-icon.png, icon-192.png, icon-512.png
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kurtside</title>
<meta name="theme-color" content="#06111d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kurtside">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #06111d; --bg2: #0a1a2b; --card: #0e2235; --card-hi: #12304a;
    --ink: #eef3f8; --muted: #8fa4b9; --line: rgba(227,189,106,.16); --line-soft: rgba(255,255,255,.07);
    --gold: #e3bd6a; --gold-deep: #b8862f;
    --gold-grad: linear-gradient(180deg, #f8e2a2 0%, #e3bd6a 45%, #b8862f 100%);
    --aqua: #3fd0ff; --aqua-glow: rgba(63,208,255,.35);
    --red: #ff6b6b; --green: #4cd69a;
    --display: 'Cinzel', Georgia, serif;
    --body: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); }
  body {
    padding-bottom: 96px;
    background:
      radial-gradient(1200px 500px at 50% -120px, rgba(63,208,255,.10), transparent 70%),
      radial-gradient(900px 400px at 100% 100%, rgba(227,189,106,.06), transparent 70%),
      var(--bg);
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  input, select, textarea { font-size: 16px; } /* 16px stops iOS from zooming on focus */

  /* ---------- Hero banner ---------- */
  /* Banner: the full image is always visible (contain), centered and capped at 960px.
     On wide screens the sides are filled with a blurred, darkened copy of the same image. */
  .hero-banner { position: relative; width: 100%; aspect-ratio: 1842 / 854; max-height: 420px; padding: 6px 0 0; overflow: hidden; background: linear-gradient(160deg, #0b1f33, #15324f); }
  .hero-banner .backdrop { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: blur(28px) brightness(.45) saturate(1.2); opacity: 0; transition: opacity .6s ease; }
  .hero-banner .main-img { position: relative; display: block; height: 100%; max-width: 960px; width: 100%; margin: 0 auto; object-fit: contain; opacity: 0; transition: opacity .6s ease; }
  .hero-banner.loaded .backdrop, .hero-banner.loaded .main-img { opacity: 1; }
  .hero-banner .fade { position: absolute; inset: auto 0 0 0; height: 10%; background: linear-gradient(180deg, transparent, var(--bg)); pointer-events: none; }
  .hero-banner .fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: 2px; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero-banner.loaded .fallback { display: none; }

  main { padding: 14px 16px 0; max-width: 640px; margin: 0 auto; position: relative; }
  .tab { display: none; animation: rise .35s ease both; }
  .tab.on { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .lbl { font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: 2.4px; text-transform: uppercase; color: var(--gold); margin: 22px 2px 10px; display: flex; align-items: center; gap: 10px; }
  .lbl::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  .card { background: linear-gradient(180deg, var(--card-hi), var(--card)); border-radius: 18px; padding: 16px; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .warn { background: rgba(255,107,107,.1); border: 1px solid rgba(255,107,107,.3); color: #ffb1b1; border-radius: 14px; padding: 11px 13px; font-size: 14px; margin-top: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }

  /* ---------- Stat strip ---------- */
  .stat { display: flex; justify-content: space-between; align-items: flex-end; }
  .stat .k { font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .money-big { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.1; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat .when { font-weight: 800; font-size: 17px; color: var(--ink); }

  /* ---------- Client picker ---------- */
  .picker { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 15px 16px; border-radius: 16px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--card-hi), var(--card)); cursor: pointer; transition: border-color .2s, box-shadow .2s; }
  .picker.sel { border-color: var(--aqua); box-shadow: 0 0 0 1px var(--aqua) inset, 0 0 24px var(--aqua-glow); }
  .picker .avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; color: #07121f; background: var(--gold-grad); flex: none; }
  .picker .avatar.empty { background: rgba(255,255,255,.06); color: var(--muted); border: 1px dashed rgba(255,255,255,.18); }
  .picker .name { font-weight: 800; font-size: 17px; }
  .picker .chev { color: var(--gold); font-size: 22px; }

  .client-list .opt { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 6px; border: 0; background: transparent; text-align: left; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .client-list .opt:last-child { border-bottom: 0; }
  .client-list .opt .nm { font-weight: 700; font-size: 16px; }
  .client-list .opt.on .nm { color: var(--aqua); }
  .client-list .tag { font-size: 11px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
  .client-list .divider { height: 1px; margin: 8px 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .7; }

  /* ---------- Chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 9px; }
  .chip { background: rgba(255,255,255,.035); border: 1px solid var(--line-soft); border-radius: 999px; padding: 11px 15px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: all .15s; }
  .chip .p { color: var(--muted); font-weight: 600; }
  .chip.sel { border-color: var(--gold); background: rgba(227,189,106,.12); box-shadow: 0 0 18px rgba(227,189,106,.18); }
  .chip.sel .p { color: var(--gold); }
  .chip.dim { opacity: .4; }
  .qty { display: inline-flex; align-items: center; gap: 7px; margin-left: 2px; font-weight: 800; }
  .qty button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--gold-grad); color: #07121f; font-weight: 800; font-size: 17px; line-height: 30px; padding: 0; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(227,189,106,.3); cursor: pointer; }
  .qty .n { min-width: 14px; text-align: center; color: var(--gold); }

  /* ---------- Forms ---------- */
  .field { display: block; margin-bottom: 13px; }
  .field span { display: block; font-size: 12px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
  .input { width: 100%; border: 1px solid var(--line-soft); border-radius: 12px; padding: 13px 14px; background: rgba(0,0,0,.25); color: var(--ink); }
  .input:focus { outline: none; border-color: var(--aqua); box-shadow: 0 0 0 3px rgba(63,208,255,.15); }
  textarea.input { min-height: 70px; resize: vertical; }
  select.input { appearance: none; }

  /* ---------- Buttons ---------- */
  .btn { border: 0; border-radius: 13px; padding: 12px 16px; font-weight: 800; font-size: 15px; background: rgba(255,255,255,.07); cursor: pointer; }
  .btn.gold { background: var(--gold-grad); color: #07121f; box-shadow: 0 6px 20px rgba(227,189,106,.25), inset 0 1px 0 rgba(255,255,255,.5); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: transparent; color: var(--red); border: 1px solid rgba(255,107,107,.35); }
  .btn.sm { padding: 8px 13px; font-size: 13px; border-radius: 10px; }
  .btn.big { width: 100%; padding: 18px; font-size: 18px; margin-top: 20px; border-radius: 16px; letter-spacing: .3px; }
  .btn:disabled { opacity: .35; box-shadow: none; filter: grayscale(.6); }
  a.btn { text-decoration: none; display: inline-block; }

  /* ---------- Money ---------- */
  .vault { text-align: center; padding: 22px 16px; background: radial-gradient(400px 160px at 50% 0%, rgba(63,208,255,.14), transparent 70%), linear-gradient(180deg, var(--card-hi), var(--card)); }
  .vault .money-big { font-size: 46px; }
  .list .item { padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
  .list .item:last-child { border-bottom: 0; }
  .amt { font-weight: 800; white-space: nowrap; }
  .badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--muted); margin-top: 4px; }
  .badge.late { background: rgba(255,107,107,.14); color: #ffa3a3; }
  .badge.ok { background: rgba(76,214,154,.14); color: var(--green); }
  .badge.hand { background: rgba(227,189,106,.14); color: var(--gold); }
  .actions { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }

  .seg { display: flex; background: rgba(0,0,0,.3); border-radius: 13px; padding: 4px; border: 1px solid var(--line-soft); }
  .seg button { flex: 1; border: 0; background: transparent; padding: 11px; border-radius: 10px; font-weight: 800; color: var(--muted); }
  .seg button.on { background: var(--gold-grad); color: #07121f; }

  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 12px; }
  .switch input { width: 22px; height: 22px; accent-color: var(--gold); }
  .item.tap { cursor: pointer; }

  /* ---------- Bottom nav ---------- */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: rgba(6,17,29,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
  nav.tabs button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 14px; font-weight: 800; font-size: 12px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  nav.tabs button .ic { font-size: 20px; line-height: 1; }
  nav.tabs button.on { color: var(--gold); background: rgba(227,189,106,.09); }

  /* ---------- Bottom sheet ---------- */
  .sheet-bg { position: fixed; inset: 0; background: rgba(2,8,14,.65); backdrop-filter: blur(3px); z-index: 20; display: none; align-items: flex-end; justify-content: center; }
  .sheet-bg.on { display: flex; }
  .sheet { background: linear-gradient(180deg, #102840, var(--bg2)); border: 1px solid var(--line); border-bottom: 0; width: 100%; max-width: 640px; max-height: 86vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom)); animation: up .25s ease both; }
  .sheet::before { content: ''; display: block; width: 44px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); margin: 0 auto 14px; }
  .sheet h3 { margin: 0 0 14px; font-family: var(--display); font-size: 20px; color: var(--gold); letter-spacing: 1px; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

  #toast { position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%) translateY(20px); background: var(--gold-grad); color: #07121f; padding: 12px 18px; border-radius: 14px; font-weight: 800; font-size: 14px; opacity: 0; transition: all .25s; z-index: 40; max-width: 90vw; text-align: center; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: var(--red); color: #fff; }
  #busy { position: fixed; inset: 0; background: rgba(6,17,29,.45); z-index: 30; display: none; align-items: center; justify-content: center; }
  #busy.on { display: flex; }
  #busy .ring { width: 46px; height: 46px; border-radius: 50%; border: 3px solid rgba(227,189,106,.2); border-top-color: var(--gold); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Service notes ---------- */
  textarea.note-box { min-height: 160px; line-height: 1.5; }
  .note-box::placeholder { color: rgba(143,164,185,.55); }
  .last-note { margin: 0 0 10px; padding: 11px 13px; border-radius: 12px; background: rgba(63,208,255,.07); border: 1px solid rgba(63,208,255,.22); font-size: 14px; line-height: 1.45; }
  .last-note .t { white-space: pre-wrap; }
  .last-note .k { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--aqua); margin-bottom: 3px; }

  /* ---------- PIN gate ---------- */
  #pinGate { position: fixed; inset: 0; z-index: 25; display: none; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(600px 300px at 50% 20%, rgba(63,208,255,.12), transparent 70%), rgba(6,17,29,.94); }
  #pinGate.on { display: flex; }
  .pin-card { width: 100%; max-width: 360px; text-align: center; }
  .pin-title { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: 1.5px; margin-bottom: 6px; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pin-input { text-align: center; font-size: 28px !important; letter-spacing: 10px; padding: 16px; }
  .pin-msg { color: #ffa3a3; font-weight: 700; margin-top: 12px; min-height: 20px; }

  .tagline { text-align: center; margin: 28px 0 8px; font-family: var(--display); font-size: 11px; letter-spacing: 3px; color: rgba(227,189,106,.55); }
</style>
</head>
<body>

<div class="hero-banner" id="hero">
  <img class="backdrop" src="banner.png" alt="" onload="document.getElementById('hero').classList.add('loaded')">
  <img class="main-img" src="banner.png" alt="Kurtside Pool Co.">
  <div class="fallback">KURTSIDE POOL CO.</div>
  <div class="fade"></div>
</div>

<main>
  <section id="tab-log" class="tab on"><div class="empty">Loading...</div></section>
  <section id="tab-money" class="tab"></section>
  <section id="tab-settings" class="tab"></section>
  <div class="tagline">MAINTENANCE &bull; OPENINGS &bull; CLOSINGS</div>
</main>

<nav class="tabs">
  <button data-tab="log" class="on" onclick="showTab('log')"><span class="ic">&#9998;</span>Log</button>
  <button data-tab="money" onclick="showTab('money')"><span class="ic">$</span>Money</button>
  <button data-tab="settings" onclick="showTab('settings')"><span class="ic">&#9881;</span>Settings</button>
</nav>

<div class="sheet-bg" id="sheetBg" onclick="if (event.target === this) closeSheet()"><div class="sheet" id="sheet"></div></div>
<div id="pinGate">
  <div class="pin-card">
    <div class="pin-title">Kurtside Pool Co.</div>
    <div class="muted" style="margin-bottom:18px">Enter your PIN to open billing</div>
    <input id="pinInput" class="input pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;" onkeydown="if (event.key === 'Enter') unlock()">
    <button class="btn gold big" style="margin-top:14px" onclick="unlock()">Unlock</button>
    <div id="pinMsg" class="pin-msg"></div>
  </div>
</div>
<div id="busy"><div class="ring"></div></div>
<div id="toast"></div>

<script>
  // ---------------- State ----------------
  const S = {
    data: null,
    tab: 'log',
    date: '',
    clientId: '',
    items: {},      // itemId -> qty
    custom: null,   // { description, price } when "Other" is open
    note: '',
    payMethod: 'Cash',
    busy: false,
    pin: '',
  };

  // ---------------- Helpers ----------------
  const $ = id => document.getElementById(id);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => '$' + (Number(n) || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const initials = name => String(name || '').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  function niceDate(ymd) {
    if (!ymd) return '';
    const [y, m, d] = ymd.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  const priceById = id => S.data.prices.find(p => p.id === id);
  const clientById = id => S.data.clients.find(c => c.id === id);
  const byName = (a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' });

  /** Active clients split for the picker: Weekly first, then Open/Close, each alphabetical. */
  function clientGroups() {
    const active = S.data.clients.filter(c => c.active);
    return {
      weekly: active.filter(c => c.type === 'Weekly').sort(byName),
      openClose: active.filter(c => c.type !== 'Weekly').sort(byName),
    };
  }

  // ---------------- PIN ----------------
  const PIN_KEY = 'kurtsidePin';
  function loadPin() { try { return localStorage.getItem(PIN_KEY) || ''; } catch (e) { return ''; } }
  function savePin(pin) { try { localStorage.setItem(PIN_KEY, pin); } catch (e) {} }
  function forgetPin() { try { localStorage.removeItem(PIN_KEY); } catch (e) {} }

  // ---------------- Backend ----------------
  // The Apps Script web app URL (Deploy > Manage deployments, ends in /exec).
  const API_URL = 'https://script.google.com/macros/s/AKfycbykZYkYEANosVuqJPJNjaRNGsRJGXS1tzow9BGWxh3tkOuiIlG8w2x4ir34C7Pj4J8LNQ/exec';

  /**
   * Every server call: POST {pin, action, payload} to API_URL, get back {ok, data | error}.
   * text/plain avoids a CORS preflight; credentials 'omit' keeps Google sign-ins out of it.
   */
  async function call(action, payload) {
    let res;
    try {
      res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ pin: S.pin, action, payload }),
        credentials: 'omit',
        redirect: 'follow',
      });
    } catch (e) {
      throw new Error('No connection. Check your signal and try again.');
    }
    let body;
    try { body = await res.json(); } catch (e) { throw new Error('Server hiccup. Try again in a moment.'); }
    if (!body.ok) {
      if (body.error === 'WRONG_PIN') { S.pin = ''; forgetPin(); showPinScreen('That PIN did not work.'); }
      throw new Error(body.error || 'Something went wrong.');
    }
    return body.data;
  }

  function showPinScreen(msg) {
    $('pinGate').classList.add('on');
    $('pinMsg').textContent = msg || '';
    $('pinInput').value = '';
    setTimeout(() => $('pinInput').focus(), 50);
  }

  async function unlock() {
    const pin = $('pinInput').value.trim();
    if (!pin) return;
    S.pin = pin;
    $('pinMsg').textContent = '';
    if (await run('bootstrap')) {
      savePin(pin);
      $('pinGate').classList.remove('on');
    }
  }

  /** Runs a server call, redraws on success, toasts on error. Returns true on success. */
  async function run(action, payload, okMsg) {
    if (S.busy) return false;
    setBusy(true);
    try {
      const data = await call(action, payload);
      if (data && data.clients) { S.data = data; render(); }
      if (okMsg) toast(okMsg);
      return true;
    } catch (e) {
      if (!(e && e.message === 'WRONG_PIN')) toast((e && e.message) || String(e), true);
      return false;
    } finally {
      setBusy(false);
    }
  }

  function setBusy(on) { S.busy = on; $('busy').classList.toggle('on', on); }
  let toastTimer;
  function toast(msg, isErr) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.toggle('err', !!isErr);
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), isErr ? 4200 : 2400);
  }
  function openSheet(html) { $('sheet').innerHTML = html; $('sheetBg').classList.add('on'); }
  function closeSheet() { $('sheetBg').classList.remove('on'); }

  function showTab(tab) {
    S.tab = tab;
    document.querySelectorAll('.tab').forEach(el => el.classList.toggle('on', el.id === 'tab-' + tab));
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    window.scrollTo(0, 0);
  }

  // ---------------- Render ----------------
  function render() {
    if (!S.date) S.date = S.data.today;
    renderLog();
    renderMoney();
    renderSettings();
  }

  // ----- Log tab -----
  function logTotal() {
    let t = 0;
    Object.keys(S.items).forEach(id => { const p = priceById(id); if (p) t += p.price * S.items[id]; });
    if (S.custom) t += Number(S.custom.price) || 0;
    return t;
  }

  function renderLog() {
    const d = S.data;
    const services = d.prices.filter(p => p.active && p.kind === 'Service');
    const extras = d.prices.filter(p => p.active && p.kind === 'Extra');
    const canLog = S.clientId && (Object.keys(S.items).length || S.custom);
    const picked = S.clientId ? clientById(S.clientId) : null;
    const anyClients = d.clients.some(c => c.active);
    const lastNote = S.clientId && d.lastNotes ? d.lastNotes[S.clientId] : null;

    const chip = p => {
      const sel = S.items[p.id];
      const noPrice = !(p.price > 0);
      const qty = sel && p.kind === 'Extra'
        ? `<span class="qty"><button onclick="event.stopPropagation(); bump('${p.id}', -1)">&minus;</button><span class="n">${sel}</span><button onclick="event.stopPropagation(); bump('${p.id}', 1)">+</button></span>`
        : '';
      // A div, not a button: the +/- stepper buttons live inside it, and buttons cannot nest.
      return `<div class="chip ${sel ? 'sel' : ''} ${noPrice ? 'dim' : ''}" role="button" tabindex="0" onclick="toggleItem('${p.id}')">
        ${esc(p.name)} <span class="p">${noPrice ? 'no price' : money(p.price)}</span>${qty}</div>`;
    };

    $('tab-log').innerHTML = `
      <div class="card stat">
        <div>
          <div class="k">Logged, not billed</div>
          <div class="money-big">${money(d.unbilledTotal)}</div>
        </div>
        <div style="text-align:right">
          <div class="k">Bills go out</div>
          <div class="when">${niceDate(d.nextBilling)}</div>
        </div>
      </div>

      <div class="lbl">Who</div>
      ${anyClients ? `
        <button class="picker ${picked ? 'sel' : ''}" onclick="openClientPicker()">
          <div class="avatar ${picked ? '' : 'empty'}">${picked ? esc(initials(picked.name)) : '?'}</div>
          <div class="grow">
            <div class="name">${picked ? esc(picked.name) : 'Choose a client'}</div>
            <div class="muted">${picked ? esc(picked.type === 'Weekly' ? 'Weekly service' : 'Openings & closings') : 'Tap to pick from your list'}</div>
          </div>
          <div class="chev">&#9662;</div>
        </button>`
        : `<div class="card empty">No clients yet. Add them in Settings.</div>`}

      <div class="lbl">When</div>
      <input type="date" class="input" value="${S.date}" max="${d.today}" onchange="S.date = this.value">

      <div class="lbl">What</div>
      <div class="chips">${services.map(chip).join('')}</div>

      <div class="lbl">Extras</div>
      <div class="chips">
        ${extras.map(chip).join('')}
        <button class="chip ${S.custom ? 'sel' : ''}" onclick="toggleCustom()">+ Other</button>
      </div>
      ${S.custom ? `
        <div class="card" style="margin-top:12px">
          <label class="field"><span>What was it?</span>
            <input class="input" id="customDesc" value="${esc(S.custom.description)}" placeholder="Chemicals, part, repair..." oninput="S.custom.description = this.value"></label>
          <label class="field" style="margin:0"><span>Charge</span>
            <input class="input" id="customPrice" type="number" inputmode="decimal" step="0.01" value="${esc(S.custom.price)}" placeholder="0.00" oninput="S.custom.price = this.value; updateLogButton()"></label>
        </div>` : ''}

      <div class="lbl">Service notes</div>
      ${lastNote ? `
        <div class="last-note">
          <div class="k">Last note &middot; ${niceDate(lastNote.date)}</div>
          <div class="t">${esc(lastNote.note)}</div>
        </div>` : ''}
      <textarea class="input note-box" placeholder="${NOTE_HINT}" oninput="S.note = this.value">${esc(S.note)}</textarea>
      <div class="muted" style="margin:6px 2px 0">Private. Notes stay in your log and never print on invoices. Tap the mic on the keyboard to talk.</div>

      <button class="btn gold big" id="logBtn" ${canLog ? '' : 'disabled'} onclick="logWork()">${logButtonText(canLog)}</button>

      <div class="lbl">Recent</div>
      <div class="card list">${d.recent.length ? d.recent.map(w => `
        <div class="item row">
          <div class="grow">
            <div style="font-weight:800">${esc(w.clientName)}</div>
            <div class="muted">${niceDate(w.date)} &middot; ${esc(w.description)}${w.qty > 1 ? ' x' + w.qty : ''}${w.note ? ' &middot; ' + esc(w.note) : ''}</div>
          </div>
          <div style="text-align:right">
            <div class="amt">${money(w.amount)}</div>
            ${w.invoiceId
              ? `<span class="badge">Billed #${esc(w.invoiceId)}</span>`
              : `<button class="btn danger sm" style="margin-top:6px" onclick="voidWork('${w.id}')">Remove</button>`}
          </div>
        </div>`).join('') : '<div class="empty">Nothing logged yet.</div>'}
      </div>`;
  }

  /** Placeholder for the service notes box: what is worth tracking week to week. */
  const NOTE_HINT = [
    'Cl 3 \u00b7 pH 7.4 \u00b7 filter 18 psi',
    'Added 2 gal chlorine, 1 lb acid',
    'Watch: pump noise, leak at return',
    'Next week: bring filter cartridge',
  ].join('&#10;');

  const logButtonText = ok => ok ? 'Log it  ' + money(logTotal()) : 'Log it';

  function updateLogButton() {
    const ok = S.clientId && (Object.keys(S.items).length || S.custom);
    $('logBtn').disabled = !ok;
    $('logBtn').textContent = logButtonText(ok);
  }

  function openClientPicker() {
    const g = clientGroups();
    const opt = c => `
      <button class="opt ${S.clientId === c.id ? 'on' : ''}" onclick="pickClient('${c.id}')">
        <span class="nm">${esc(c.name)}</span>
        <span class="tag">${c.type === 'Weekly' ? 'Weekly' : 'Open/Close'}</span>
      </button>`;
    openSheet(`
      <h3>Choose a client</h3>
      <div class="client-list">
        ${g.weekly.map(opt).join('')}
        ${g.weekly.length && g.openClose.length ? '<div class="divider"></div>' : ''}
        ${g.openClose.map(opt).join('')}
      </div>`);
  }

  function pickClient(id) {
    S.clientId = id;
    const c = clientById(id);
    const visit = priceById('VISIT');
    // Weekly clients default to a visit so the common case is: pick client, Log it.
    if (c && c.type === 'Weekly' && !Object.keys(S.items).length && !S.custom && visit && visit.active && visit.price > 0) {
      S.items = { VISIT: 1 };
    }
    closeSheet();
    renderLog();
  }

  function toggleItem(id) {
    const p = priceById(id);
    if (!p) return;
    if (!(p.price > 0)) { toast('Set a price for ' + p.name + ' in Settings first.', true); return; }
    if (S.items[id]) delete S.items[id]; else S.items[id] = 1;
    renderLog();
  }

  function bump(id, delta) {
    const next = (S.items[id] || 0) + delta;
    if (next <= 0) delete S.items[id]; else S.items[id] = Math.min(next, 99);
    renderLog();
  }

  function toggleCustom() {
    S.custom = S.custom ? null : { description: '', price: '' };
    renderLog();
    if (S.custom) $('customDesc').focus();
  }

  async function logWork() {
    const client = clientById(S.clientId);
    const items = Object.keys(S.items).map(id => ({ itemId: id, qty: S.items[id] }));
    if (S.custom) items.push({ itemId: 'CUSTOM', description: S.custom.description, price: S.custom.price, qty: 1 });
    const total = logTotal();
    const ok = await run('logWork', { date: S.date, clientId: S.clientId, items, note: S.note },
      'Logged ' + (client ? client.name.split(' ')[0] : '') + ': ' + money(total));
    if (ok) {
      S.clientId = ''; S.items = {}; S.custom = null; S.note = '';
      renderLog();
    }
  }

  function voidWork(id) {
    if (!confirm('Remove this entry? It will not be billed.')) return;
    run('voidWork', id, 'Removed');
  }

  // ----- Money tab -----
  function invoiceBadge(i) {
    if (!i.email) return '<span class="badge hand">Hand deliver</span>';
    if (!i.emailed) return '<span class="badge late">Not emailed</span>';
    if (i.daysLate > 0) return `<span class="badge late">${i.daysLate} day${i.daysLate === 1 ? '' : 's'} late</span>`;
    return `<span class="badge">Due ${niceDate(i.dueDate)}</span>`;
  }

  function renderMoney() {
    const d = S.data;
    const open = d.openInvoices.slice().sort((a, b) => b.daysLate - a.daysLate || a.dueDate.localeCompare(b.dueDate));
    const owed = open.reduce((t, i) => t + i.balance, 0);
    const late = open.filter(i => i.daysLate > 0).length;

    $('tab-money').innerHTML = `
      <div class="card vault">
        <div class="muted" style="letter-spacing:1.4px;text-transform:uppercase;font-weight:800;font-size:12px">Owed to you</div>
        <div class="money-big">${money(owed)}</div>
        <div class="muted">${open.length} open invoice${open.length === 1 ? '' : 's'}${late ? ' &middot; <span style="color:#ffa3a3">' + late + ' late</span>' : ''}</div>
      </div>

      <div class="lbl">Open invoices</div>
      <div class="card list">${open.length ? open.map(i => `
        <div class="item">
          <div class="row">
            <div class="grow">
              <div style="font-weight:800">${esc(i.clientName)}</div>
              <div class="muted">#${esc(i.id)} &middot; ${niceDate(i.invoiceDate)}${i.paid ? ' &middot; ' + money(i.paid) + ' paid so far' : ''}</div>
            </div>
            <div style="text-align:right"><div class="amt">${money(i.balance)}</div>${invoiceBadge(i)}</div>
          </div>
          <div class="actions">
            <button class="btn gold sm" onclick="openPay('${i.id}')">Got paid</button>
            ${i.pdfUrl ? `<a class="btn ghost sm" href="${i.pdfUrl}" target="_blank">PDF</a>` : ''}
            ${i.email ? `<button class="btn ghost sm" onclick="resend('${i.id}')">Resend</button>` : ''}
          </div>
        </div>`).join('') : '<div class="empty">Nobody owes you anything. Nice.</div>'}
      </div>

      <div class="lbl">Recently paid</div>
      <div class="card list">${d.paidInvoices.length ? d.paidInvoices.map(i => `
        <div class="item row">
          <div class="grow"><div style="font-weight:800">${esc(i.clientName)}</div><div class="muted">#${esc(i.id)} &middot; ${niceDate(i.invoiceDate)}</div></div>
          <div style="text-align:right"><div class="amt">${money(i.total)}</div><span class="badge ok">Paid</span></div>
        </div>`).join('') : '<div class="empty">No paid invoices yet.</div>'}
      </div>`;
  }

  function openPay(id) {
    const i = S.data.openInvoices.find(x => x.id === id);
    if (!i) return;
    S.payMethod = 'Cash';
    openSheet(`
      <h3>Got paid</h3>
      <div class="muted" style="margin:-6px 0 16px">${esc(i.clientName)} &middot; Invoice #${esc(i.id)} &middot; balance ${money(i.balance)}</div>
      <label class="field"><span>Amount</span>
        <input class="input" id="payAmt" type="number" inputmode="decimal" step="0.01" value="${i.balance.toFixed(2)}"></label>
      <div class="field"><span>How</span>
        <div class="seg" id="paySeg">
          <button class="on" onclick="setPayMethod('Cash')">Cash</button>
          <button onclick="setPayMethod('Check')">Check</button>
        </div>
      </div>
      <label class="field" id="checkWrap" style="display:none"><span>Check # (optional)</span>
        <input class="input" id="payCheck" inputmode="numeric"></label>
      <label class="field"><span>Date received</span>
        <input class="input" id="payDate" type="date" value="${S.data.today}" max="${S.data.today}"></label>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost grow" onclick="closeSheet()">Cancel</button>
        <button class="btn gold grow" onclick="savePayment('${i.id}')">Save</button>
      </div>`);
  }

  function setPayMethod(m) {
    S.payMethod = m;
    document.querySelectorAll('#paySeg button').forEach(b => b.classList.toggle('on', b.textContent === m));
    $('checkWrap').style.display = m === 'Check' ? '' : 'none';
  }

  async function savePayment(id) {
    const ok = await run('recordPayment', {
      invoiceId: id, amount: $('payAmt').value, method: S.payMethod, checkNo: $('payCheck').value, date: $('payDate').value,
    }, 'Payment saved');
    if (ok) closeSheet();
  }

  function resend(id) {
    if (!confirm('Email invoice #' + id + ' again?')) return;
    run('resendInvoice', id, 'Invoice sent');
  }

  // ----- Settings tab -----
  function renderSettings() {
    const d = S.data;
    const st = d.settings;
    const unpriced = d.prices.filter(p => p.active && !(p.price > 0));
    const noEmail = d.clients.filter(c => c.active && !c.email);
    const g = clientGroups();
    const inactive = d.clients.filter(c => !c.active).sort(byName);
    const clientRow = c => `
      <div class="item row tap" onclick="editClient('${c.id}')">
        <div class="grow"><div style="font-weight:800${c.active ? '' : ';opacity:.45'}">${esc(c.name)}</div>
          <div class="muted">${esc(c.type)}${c.active ? '' : ' &middot; inactive'} &middot; ${c.email ? esc(c.email) : '<span style="color:var(--red)">no email</span>'}</div></div>
        <div class="muted" style="color:var(--gold)">&rsaquo;</div>
      </div>`;

    $('tab-settings').innerHTML = `
      ${unpriced.length ? `<div class="warn">No price set for <b>${unpriced.map(p => esc(p.name)).join(', ')}</b>. Tap it below to set one.</div>` : ''}

      <div class="lbl">Prices</div>
      <div class="card list">
        ${d.prices.map(p => `
          <div class="item row tap" onclick="editPrice('${p.id}')">
            <div class="grow"><div style="font-weight:800${p.active ? '' : ';opacity:.45'}">${esc(p.name)}</div><div class="muted">${p.kind === 'Service' ? 'Main service' : 'Extra'}${p.active ? '' : ' &middot; hidden'}</div></div>
            <div class="amt">${p.price > 0 ? money(p.price) : '<span style="color:var(--red)">Set price</span>'}</div>
          </div>`).join('')}
        <button class="btn ghost sm" style="margin-top:12px" onclick="editPrice('')">+ Add item</button>
      </div>
      <div class="muted" style="margin:8px 2px 0">Price changes apply to work logged from now on. Anything already logged keeps its price.</div>

      <div class="lbl">Clients</div>
      ${noEmail.length ? `<div class="warn" style="margin:0 0 12px">${noEmail.length} client${noEmail.length === 1 ? ' has' : 's have'} no email. Their invoices will need to be handed over.</div>` : ''}
      <div class="card list client-list">
        ${g.weekly.map(clientRow).join('')}
        ${g.weekly.length && g.openClose.length ? '<div class="divider"></div>' : ''}
        ${g.openClose.map(clientRow).join('')}
        ${inactive.length ? '<div class="divider" style="opacity:.3"></div>' + inactive.map(clientRow).join('') : ''}
        ${d.clients.length ? '' : '<div class="empty">No clients yet.</div>'}
        <button class="btn ghost sm" style="margin-top:12px" onclick="editClient('')">+ Add client</button>
      </div>

      <div class="lbl">Business info</div>
      <div class="card">
        <label class="field"><span>Business name</span><input class="input" id="setBiz" value="${esc(st.BUSINESS_NAME)}"></label>
        <label class="field"><span>Your name (signs emails)</span><input class="input" id="setOwner" value="${esc(st.OWNER_NAME)}"></label>
        <label class="field"><span>Phone</span><input class="input" id="setPhone" type="tel" value="${esc(st.BUSINESS_PHONE)}"></label>
        <label class="field"><span>Email (replies come here)</span><input class="input" id="setEmail" type="email" value="${esc(st.BUSINESS_EMAIL)}" placeholder="Blank = this Google account"></label>
        <label class="field"><span>Checks payable to</span><input class="input" id="setPayable" value="${esc(st.CHECKS_PAYABLE_TO)}" placeholder="${esc(st.BUSINESS_NAME)}"></label>
        <label class="field"><span>Mail checks to (optional)</span><input class="input" id="setMail" value="${esc(st.MAILING_ADDRESS)}"></label>
        <label class="field"><span>Payment due (days after invoice)</span><input class="input" id="setTerms" type="number" inputmode="numeric" value="${esc(st.TERMS_DAYS)}"></label>
        <div class="switch">
          <div><div style="font-weight:800">Pause automation</div><div class="muted">Stops invoices and reminders from sending</div></div>
          <input type="checkbox" id="setPaused" ${st.AUTOMATION_PAUSED ? 'checked' : ''}>
        </div>
        <button class="btn gold" style="width:100%" onclick="saveSettings()">Save business info</button>
      </div>`;
  }

  function editPrice(id) {
    const p = id ? priceById(id) : { id: '', name: '', price: '', kind: 'Extra', active: true };
    openSheet(`
      <h3>${id ? 'Edit item' : 'New item'}</h3>
      <label class="field"><span>Name</span><input class="input" id="pName" value="${esc(p.name)}"></label>
      <label class="field"><span>Price</span><input class="input" id="pPrice" type="number" inputmode="decimal" step="0.01" value="${p.price === '' ? '' : Number(p.price).toFixed(2)}"></label>
      <label class="field"><span>Shows under</span>
        <select class="input" id="pKind">
          <option ${p.kind === 'Service' ? 'selected' : ''} value="Service">What (main service)</option>
          <option ${p.kind === 'Extra' ? 'selected' : ''} value="Extra">Extras</option>
        </select></label>
      ${id ? `<div class="switch"><div style="font-weight:800">Show in the app</div><input type="checkbox" id="pActive" ${p.active ? 'checked' : ''}></div>` : ''}
      <div class="row">
        <button class="btn ghost grow" onclick="closeSheet()">Cancel</button>
        <button class="btn gold grow" onclick="savePrice('${p.id}')">Save</button>
      </div>`);
  }

  async function savePrice(id) {
    const ok = await run('savePrice', {
      id, name: $('pName').value, price: $('pPrice').value, kind: $('pKind').value, active: id ? $('pActive').checked : true,
    }, 'Saved');
    if (ok) closeSheet();
  }

  function editClient(id) {
    const c = id ? clientById(id) : { id: '', name: '', address: '', email: '', phone: '', type: 'Weekly', active: true, notes: '' };
    openSheet(`
      <h3>${id ? 'Edit client' : 'New client'}</h3>
      <label class="field"><span>Name</span><input class="input" id="cName" value="${esc(c.name)}"></label>
      <label class="field"><span>Email (invoices go here)</span><input class="input" id="cEmail" type="email" value="${esc(c.email)}"></label>
      <label class="field"><span>Address</span><input class="input" id="cAddress" value="${esc(c.address)}"></label>
      <label class="field"><span>Phone</span><input class="input" id="cPhone" type="tel" value="${esc(c.phone)}"></label>
      <label class="field"><span>Service type</span>
        <select class="input" id="cType">
          <option ${c.type === 'Weekly' ? 'selected' : ''} value="Weekly">Weekly service</option>
          <option ${c.type === 'Open/Close' ? 'selected' : ''} value="Open/Close">Openings & closings only</option>
        </select></label>
      <label class="field"><span>Notes</span><textarea class="input" id="cNotes">${esc(c.notes)}</textarea></label>
      ${id ? `<div class="switch"><div><div style="font-weight:800">Active</div><div class="muted">Inactive clients are hidden from Log</div></div><input type="checkbox" id="cActive" ${c.active ? 'checked' : ''}></div>` : ''}
      <div class="row">
        <button class="btn ghost grow" onclick="closeSheet()">Cancel</button>
        <button class="btn gold grow" onclick="saveClient('${c.id}')">Save</button>
      </div>`);
  }

  async function saveClient(id) {
    const ok = await run('saveClient', {
      id, name: $('cName').value, email: $('cEmail').value, address: $('cAddress').value, phone: $('cPhone').value,
      type: $('cType').value, notes: $('cNotes').value, active: id ? $('cActive').checked : true,
    }, 'Saved');
    if (ok) closeSheet();
  }

  function saveSettings() {
    run('saveSettings', {
      BUSINESS_NAME: $('setBiz').value, OWNER_NAME: $('setOwner').value, BUSINESS_PHONE: $('setPhone').value,
      BUSINESS_EMAIL: $('setEmail').value, CHECKS_PAYABLE_TO: $('setPayable').value, MAILING_ADDRESS: $('setMail').value,
      TERMS_DAYS: $('setTerms').value, AUTOMATION_PAUSED: $('setPaused').checked,
    }, 'Saved');
  }

  // ---------------- Start ----------------
  S.pin = loadPin();
  if (S.pin) {
    run('bootstrap');
  } else {
    showPinScreen();
  }
</script>
</body>
</html>
